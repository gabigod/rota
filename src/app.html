<title>Rotas de Bike do Tem</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
/* Layout: mapa vetorial grande + caderno com abas (paradas, cronograma, números) ao lado; perfil de altitude embaixo do mapa */
:root{
  --bg:#E7ECE4; --panel:#F8F9F5; --ink:#15211C; --muted:#5A6A61; --line:#CBD4C9;
  --route:#C21F6B; --route-soft:#C21F6B22; --bar:#C21F6B; --side:#22788A; --sea:#CADCDF; --land:#DCE2D4; --land-ba:#F3F1E1; --land-stroke:#B9C3B3;
  --chip:#E1E8DD; --good:#2E7D4F; --halo:#F8F9F5; --warn:#A35F00;
  --sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px)); --sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));
  --sal:max(env(safe-area-inset-left,0px),var(--safe-area-inset-left,0px)); --sar:max(env(safe-area-inset-right,0px),var(--safe-area-inset-right,0px));
  --f-display:"Bricolage Grotesque", "Bricolage Grotesque Variable", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Figtree Variable", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", "JetBrains Mono Variable", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1613; --panel:#151F1B; --ink:#E5ECE6; --muted:#93A399; --line:#2A3832;
  --route:#FF5FA2; --route-soft:#FF5FA226; --bar:#E84A8A; --side:#5CC3D6; --sea:#0B1A1E; --land:#1A2520; --land-ba:#24312A; --land-stroke:#33433B;
  --chip:#1F2B26; --good:#6CCB90; --halo:#151F1B; --warn:#F0B44C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1613; --panel:#151F1B; --ink:#E5ECE6; --muted:#93A399; --line:#2A3832;
  --route:#FF5FA2; --route-soft:#FF5FA226; --bar:#E84A8A; --side:#5CC3D6; --sea:#0B1A1E; --land:#1A2520; --land-ba:#24312A; --land-stroke:#33433B;
  --chip:#1F2B26; --good:#6CCB90; --halo:#151F1B; --warn:#F0B44C; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--route);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 410px;grid-template-rows:auto minmax(0,1fr) auto;height:100%;
  gap:12px;padding:max(14px,var(--sat)) max(16px,var(--sar)) max(14px,var(--sab)) max(16px,var(--sal))}
.scrim{position:fixed;top:0;left:0;right:0;height:var(--sat);background:var(--bg);z-index:20;pointer-events:none}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.crumbs b{color:var(--ink);font-weight:600}
.crumbs .sep{opacity:.5}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4vw,40px);line-height:1.02;margin:4px 0 0;letter-spacing:-.02em;text-wrap:balance}
h1 span{color:var(--route)}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px}
.stat{display:flex;flex-direction:column}
.stat .v{font-family:var(--f-mono);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.mapwrap{position:relative;min-height:0;background:var(--sea);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
#map{width:100%;height:100%;display:block;isolation:isolate;background:var(--sea);font-family:var(--f-body)}
#map.leaflet-container{font-size:12px}
.leaflet-container .leaflet-tooltip.slbl{background:none;border:0;box-shadow:none;padding:0;font:600 12px var(--f-body);color:var(--ink);text-shadow:0 0 3px var(--halo),0 0 3px var(--halo),0 0 2px var(--halo),0 0 5px var(--halo)}
.leaflet-tooltip.slbl::before,.leaflet-tooltip.tlbl::before,.leaflet-tooltip.slabel::before{display:none}
.leaflet-container .leaflet-tooltip.slbl.sel{font-size:13px;font-weight:800}
.leaflet-container .leaflet-tooltip.tlbl{background:none;border:0;box-shadow:none;padding:0;font:500 10.5px var(--f-body);color:var(--muted);text-shadow:0 0 3px var(--halo),0 0 3px var(--halo),0 0 2px var(--halo)}
.leaflet-container .leaflet-tooltip.slabel{background:none;border:0;box-shadow:none;padding:0;font:400 11px var(--f-mono);letter-spacing:.12em;color:var(--muted)}
.leaflet-container .leaflet-tooltip.slabel.pais{font-size:10px;letter-spacing:.2em}
.curdot{width:16px;height:16px;border-radius:50%;background:var(--ink);border:3px solid var(--panel);box-shadow:0 0 0 1px var(--ink)}
.leaflet-control-attribution{font-size:10px;background:color-mix(in srgb,var(--panel) 80%,transparent)!important;color:var(--muted)}
.leaflet-control-attribution a{color:var(--muted)}
.lbox{position:absolute;left:10px;top:10px;z-index:1000;display:flex;flex-wrap:wrap;gap:4px;max-width:calc(100% - 66px)}
.lbox button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
.lbox button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.zbox,.legend{z-index:1000}
.ufbar{flex-basis:100%;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.ufbar button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:baseline}
.ufbar button small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.ufbar button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.ufbar button[aria-pressed="true"] small{color:var(--panel);opacity:.75}
.zbox{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zbtn{width:34px;height:34px;padding:0;font-size:18px;line-height:1;border:1px solid var(--line);background:var(--panel);border-radius:999px;cursor:pointer}
.legend{position:absolute;left:10px;bottom:10px;right:56px;width:max-content;max-width:calc(100% - 66px);flex-wrap:wrap;display:flex;gap:4px 12px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.legend span{white-space:nowrap}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid var(--route);vertical-align:middle;margin-right:6px}
.legend i.d{border-top:2.5px dashed var(--side)}
.legend i.b{border-top:2.5px dotted var(--side)}
.legend i.a{border-top:3px dotted var(--route)}
.legend i.f{border-top:3px solid var(--muted);opacity:.55}
.legend i.o{border-top:0;height:3px;background:repeating-linear-gradient(90deg,var(--side) 0 6px,transparent 6px 9px,var(--side) 9px 11px,transparent 11px 14px)}
.profile{grid-column:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px 4px;min-width:0}
.profile .hd{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:10px}
.profile .hd b{font-family:var(--f-mono);color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
#prof{width:100%;height:120px;display:block;touch-action:pan-y}
.parea{fill:var(--route-soft)}
.pline{fill:none;stroke:var(--route);stroke-width:1.5}
.ptick line{stroke:var(--line)}
.ptick text,.paxis text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.pstop{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3}
.pstop.sel{stroke:var(--ink);stroke-dasharray:none;stroke-width:1.5}
.pcur{stroke:var(--ink);stroke-width:1}
aside{grid-column:2;grid-row:2/4;min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ahd{padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;background:var(--chip);border-radius:999px;padding:3px}
.tabs button{flex:1;border:1px solid transparent;background:none;border-radius:999px;padding:5px 10px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);border-color:var(--line)}
.tools{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.search{flex:1;min-width:140px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:14px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.acount,.dlmsg{flex-basis:100%;font-size:12px;color:var(--muted)}
.list{overflow-y:auto;padding:6px 0 18px;min-height:0;flex:1}
.panel{overflow-y:auto;min-height:0;flex:1;padding:12px 16px 20px}
.ufhd{padding:12px 16px 2px;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.ufhd span{font-family:var(--f-mono);font-weight:400;letter-spacing:0;text-transform:none}
.item{position:relative;padding:0 16px 0 58px}
.item::before{content:"";position:absolute;left:31px;top:0;bottom:0;border-left:2px solid var(--line)}
.leg::before{content:"";position:absolute;left:31px;top:0;bottom:0;border-left:2px dotted var(--line)}
.item:first-child::before{top:22px}
.item.last::before{bottom:calc(100% - 22px)}
.row{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:10px 0 8px;cursor:pointer}
.dot{position:absolute;left:20px;top:10px;width:24px;height:24px;border-radius:50%;background:var(--panel);border:2px solid var(--route);
  display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;font-weight:600;color:var(--route)}
.item.big .dot{background:var(--route);color:var(--panel)}
.item.lat{padding-left:70px}
.item.lat .dot{left:36px;width:16px;height:16px;top:14px;border-color:var(--side);border-style:dashed;background:var(--panel)}
.item.opc .dot{border-style:dotted}
.item.opc .row .n{font-weight:500}
.item.warn .dot{border-color:var(--warn);color:var(--warn)}
.item.done .dot{border-color:var(--good);color:var(--good)}
.item.big.done .dot{background:var(--good);color:var(--panel)}
.row .t{flex:1;min-width:0}
.row .n{font-weight:600;font-size:15px;display:block}
.row .m{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.row .km{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:2px}
.tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;background:var(--chip);border-radius:4px;padding:1px 6px;color:var(--ink)}
.tag.lat{color:var(--side)}
.tag.warn{color:var(--warn)}
.tag.opc{background:none;border:1px dashed var(--side);color:var(--side)}
.dt{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ep{font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;background:var(--chip)}
.ep.ok{color:var(--good)}
.ep.no{color:var(--warn)}
.leg{position:relative;padding:4px 16px 2px 58px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:2px 12px}
.leg b{color:var(--ink);font-weight:600}
.leg span{white-space:nowrap}
.leg span.txt{white-space:normal}
.agua{color:var(--side);font-weight:600}
.agua.alto{color:var(--warn)}
.card{margin:0 0 12px;padding:12px 14px;background:var(--bg);border-radius:10px;font-size:14px}
.card p{margin:0 0 8px}
.card ul{margin:0 0 8px;padding-left:18px}
.card li{margin:2px 0}
.card .dica{border-left:3px solid var(--route);padding:4px 0 4px 10px;color:var(--ink);margin:6px 0 10px}
.card .acts{display:flex;flex-wrap:wrap;gap:8px}
.card .acts a,.card .acts button{font-size:13px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;text-decoration:none;color:var(--ink);cursor:pointer}
.card .acts button[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--panel)}
.caminho{font-size:13px;color:var(--muted);margin:0 0 8px}
.caminho b{color:var(--ink);font-weight:600}
.plano{font-size:13px;margin:0 0 10px;padding:8px 10px;border:1px dashed var(--line);border-radius:8px}
.plano ol{margin:4px 0 0;padding-left:20px}
.plano li{margin:1px 0}
.plano .num{font-family:var(--f-mono)}
.next{margin:10px 16px 0;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;font-size:13.5px;color:var(--muted)}
.next b{color:var(--ink)}
.next .ttl{font-family:var(--f-display);font-weight:700;color:var(--ink);font-size:15px;margin-bottom:4px}
.foot{font-size:11.5px;color:var(--muted);padding:8px 16px 0}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.cfg label{display:flex;flex-direction:column;gap:4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.cfg input,.cfg select{text-transform:none;letter-spacing:0;font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0;width:100%}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}
.tile{background:var(--bg);border-radius:10px;padding:9px 12px;min-width:0}
.tile .l{font-size:12px;color:var(--muted)}
.tile .v{font-size:20px;font-weight:600;line-height:1.25}
.tile .s{font-size:12px;color:var(--muted)}
.alerta{border-left:3px solid var(--warn);background:var(--bg);border-radius:0 10px 10px 0;padding:8px 12px;font-size:13px;margin:0 0 6px}
.alerta.ok{border-left-color:var(--good)}
.alerta ul{margin:6px 0 0;padding-left:18px}
.lk{background:none;border:0;padding:0;color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;cursor:pointer}
.h3{font-family:var(--f-display);font-weight:700;font-size:15px;margin:18px 0 6px}
.chartbox{position:relative}
.chartbox svg{display:block;width:100%}
.bar{fill:var(--bar)}
.hit:hover + .bar,.bar.on{opacity:.75}
.gl{stroke:var(--line);stroke-width:1}
.axt{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.vlab{font-family:var(--f-mono);font-size:11px;fill:var(--ink)}
.clab{font-size:12.5px;fill:var(--ink)}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--ink);color:var(--panel);font-size:12px;line-height:1.35;padding:6px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,calc(-100% - 8px))}
.tip b{font-size:13px}
.mes{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:16px 0 2px;font-family:var(--f-display);font-weight:700;font-size:14px}
.mes span{font-family:var(--f-mono);font-weight:400;font-size:11.5px;color:var(--muted);text-align:right}
.crow{display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:6px 0;cursor:pointer;font-size:13.5px}
.crow .cd{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.crow .cn{min-width:0}
.crow.k .cn{font-weight:600}
.crow .ep{margin-left:6px;white-space:normal}
.rec{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.rec .rv{font-family:var(--f-mono);font-weight:600;text-align:right;white-space:nowrap}
.rec .rw{grid-column:1/-1;font-size:12px;color:var(--muted)}
.meter{height:8px;border-radius:999px;background:var(--chip);overflow:hidden;margin:6px 0 4px}
.meter i{display:block;height:100%;background:var(--good);border-radius:999px}
.cnote{font-size:12px;color:var(--muted);margin:16px 0 0}
.cnote a{color:var(--ink)}
@media (max-width:900px){
  html,body{height:auto}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;height:auto}
  .mapwrap{height:58svh;min-height:340px}
  .profile{grid-column:1}
  aside{grid-column:1;grid-row:auto}
  .list,.panel{overflow:visible}
  .stats{gap:6px 16px}
  .stat .v{font-size:17px}
}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="scrim" aria-hidden="true"></div>
<div class="app" id="app">
  <header>
    <div>
      <nav class="crumbs" id="crumbs" aria-label="Região"><span>América do Sul</span><span class="sep">›</span><b>Rota inteira</b></nav>
      <h1 id="h1">Volta pela <span>América do Sul</span></h1>
    </div>
    <div class="stats" id="stats"></div>
    <div class="ufbar" id="ufbar" role="group" aria-label="Escolher estado ou país"></div>
  </header>

  <div class="mapwrap">
    <div id="map" role="application" aria-label="Mapa da rota de bike pela América do Sul"></div>
    <div class="lbox" id="lbox" role="group" aria-label="Tipo de mapa"></div>
    <div class="zbox">
      <button class="zbtn" id="zin" aria-label="Aproximar">+</button>
      <button class="zbtn" id="zout" aria-label="Afastar">−</button>
      <button class="zbtn" id="zfit" aria-label="Enquadrar a rota" title="Enquadrar">⤢</button>
    </div>
    <div class="legend"><span><i></i>Rota</span><span><i class="d"></i>Bate-volta</span><span id="lg-opc"><i class="o"></i>Desvio opcional</span><span><i class="b"></i>Barco</span><span id="lg-aprox"><i class="a"></i>Aproximado</span><span id="lg-prog" hidden><i class="f"></i>Já pedalado</span></div>
  </div>

  <section class="profile" aria-label="Perfil de altitude">
    <div class="hd"><span id="ptitle">Perfil de altitude</span><span id="phd">Passe o dedo ou o mouse no gráfico</span></div>
    <svg id="prof"></svg>
  </section>

  <aside>
    <div class="ahd">
      <div class="tabs" role="tablist" aria-label="Seções">
        <button role="tab" id="tab-paradas" data-tab="paradas" aria-selected="true" aria-controls="list">Paradas</button>
        <button role="tab" id="tab-crono" data-tab="crono" aria-selected="false" aria-controls="crono">Cronograma</button>
        <button role="tab" id="tab-nums" data-tab="nums" aria-selected="false" aria-controls="nums">Números</button>
      </div>
    </div>
    <div class="tools" id="tools">
      <input class="search" id="q" type="search" placeholder="Buscar parada" aria-label="Buscar parada" autocomplete="off">
      <button class="btn" id="gpxbtn" hidden title="Baixa o trecho em GPX (dentro de um .zip) para GPS, Strava, komoot ou Organic Maps">Baixar GPX</button>
      <span class="acount" id="acount"></span>
      <span class="dlmsg" id="dlmsg" hidden></span>
    </div>
    <div class="list" id="list" role="tabpanel" aria-labelledby="tab-paradas"></div>
    <div class="panel" id="crono" role="tabpanel" aria-labelledby="tab-crono" hidden>
      <div class="cfg">
        <label>Saída<input type="date" id="cfg-start"></label>
        <label>Ritmo
          <select id="cfg-pace"></select>
        </label>
        <label>Dias parados
          <select id="cfg-rest">
            <option value="1">Todos (100%)</option>
            <option value="0.75">75%</option>
            <option value="0.6">60%</option>
            <option value="0.4">40%</option>
          </select>
        </label>
      </div>
      <div id="crono-body"></div>
    </div>
    <div class="panel" id="nums" role="tabpanel" aria-labelledby="tab-nums" hidden></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
const DATA = __DATA__;
const fmt = n => Math.round(n).toLocaleString('pt-BR');

    (bad.length ? `<ul>${bad.map(x => `<li><button class="lk" data-go="${x.s.id}">${x.s.nome}</button>: chega em ${fM(SCH.at[x.s.id])}. ${x.ep.t}.</li>`).join('')}</ul>` : '') + `</div>`;
  h += `<div class="h3">Km pedalados por mês</div><div class="chartbox"><svg id="kmmes" role="img" aria-label="Km pedalados por mês"></svg><div class="tip" id="tip1" hidden></div></div>`;
  const sts = stops.filter(inScope);
  h += `<div class="h3">Calendário${scope !== 'NE' ? ' · ' + ufBy[scope].nome : ''}</div>`;
  let cur = null;
  for (const s of sts) {
    const d = dAt(SCH.at[s.id]), key = d.getUTCFullYear() * 12 + d.getUTCMonth();
    if (key !== cur) {
      cur = key;
      const mo = SCH.months[SCH.mIdx[key]];
      h += `<div class="mes">${MESL[d.getUTCMonth()]} de ${d.getUTCFullYear()}<span>${fmt(mo ? mo.km : 0)} km no mês</span></div>`;
    }
    h += `<button class="crow ${BIG.has(s.tipo) ? 'k' : ''}" data-go="${s.id}"><span class="cd">${fDs(SCH.at[s.id])}</span><span class="cn">${s.lateral ? '↳ ' : ''}${s.nome}${s.opcional ? ' <small>(opcional)</small>' : chipEpoca(s)}</span></button>`;
  }
  h += `<p class="cnote">Como calculo: ${cfg.pace} km por dia no plano, e cada 1.000 m de subida conta como 10 km a mais. Os dias parados são ${Math.round(cfg.rest * 100)}% dos que sugeri em cada parada; os bate-voltas usam os dias sugeridos ou o tempo de pedalar ida e volta, e os desvios opcionais não entram. As travessias de barco somam os dias da travessia. É uma estimativa para planejar: muda o ritmo e os descansos para ver o efeito nas épocas.</p>`;
  body.innerHTML = h;
  drawKmMes();
}
document.getElementById('crono').addEventListener('click', ev => { const b = ev.target.closest('[data-go]'); if (b) goTo(b.dataset.go); });
function drawKmMes() {
  const el = document.getElementById('kmmes'); if (!el) return;
  const tip = document.getElementById('tip1');
  const M = SCH.months;
  const w = el.getBoundingClientRect().width || 360, h = 170, m = {l: 44, r: 6, t: 18, b: 34};
  const x = d3.scaleBand(M.map(d => d.key), [m.l, w - m.r]).paddingInner(0.25).paddingOuter(0.1);
  const bw = Math.min(24, x.bandwidth());
  const y = d3.scaleLinear([0, d3.max(M, d => d.km) || 1], [h - m.b, m.t]).nice();
  const s = d3.select(el).attr('viewBox', `0 0 ${w} ${h}`).attr('height', h);
  s.selectAll('*').remove();
  s.append('g').selectAll('line').data(y.ticks(3)).join('line').attr('class', 'gl').attr('x1', m.l).attr('x2', w - m.r).attr('y1', d => y(d)).attr('y2', d => y(d));
  s.append('g').selectAll('text').data(y.ticks(3)).join('text').attr('class', 'axt').attr('x', m.l - 6).attr('y', d => y(d) + 3).attr('text-anchor', 'end').text(d => fmt(d));
  s.append('g').selectAll('text').data(M).join('text').attr('class', 'axt').attr('text-anchor', 'middle')
    .attr('x', d => x(d.key) + x.bandwidth() / 2).attr('y', h - m.b + 13).text(d => x.bandwidth() >= 9 ? MES[d.m][0].toUpperCase() : '');
  s.append('g').selectAll('text').data(M.filter((d, i) => d.m === 0 || i === 0)).join('text').attr('class', 'axt').attr('text-anchor', 'start')
    .attr('x', d => x(d.key)).attr('y', h - 4).text(d => String(d.y));
  const g = s.append('g').selectAll('g').data(M).join('g');
  g.append('rect').attr('class', 'hit').attr('fill', 'transparent').attr('x', d => x(d.key) - x.step() * 0.125).attr('width', x.step()).attr('y', m.t).attr('height', h - m.b - m.t);
  g.append('path').attr('class', 'bar').attr('d', d => colPath(x(d.key) + (x.bandwidth() - bw) / 2, y(d.km), bw, y(0) - y(d.km)));
  g.attr('tabindex', 0).attr('role', 'img').attr('aria-label', d => `${MESL[d.m]} de ${d.y}: ${fmt(d.km)} km`)
    .on('pointerenter pointermove focus', function (ev, d) {
      d3.select(el).selectAll('.bar').classed('on', false); d3.select(this).select('.bar').classed('on', true);
      showTip(tip, x(d.key) + x.bandwidth() / 2, y(d.km), fmt(d.km) + ' km', [`${MESL[d.m]} de ${d.y}`, d.regs.slice(0, 4).join(', ') + (d.regs.length > 4 ? '…' : '')]);
    })
    .on('pointerleave blur', function () { d3.select(this).select('.bar').classed('on', false); tip.hidden = true; });
  const mx = maxBy(M, d => d.km);
  if (mx) s.append('text').attr('class', 'vlab').attr('text-anchor', 'middle').attr('x', x(mx.key) + x.bandwidth() / 2).attr('y', y(mx.km) - 5).text(fmt(mx.km));
}

/* ---------- números ---------- */
function renderNums() {
  const el = document.getElementById('nums');
  const kmP = {};
  UFS.forEach(u => { const p = paisOf(u.sigla); kmP[p] = (kmP[p] || 0) + u.km; });
  const rows = Object.entries(kmP).sort((a, b) => b[1] - a[1]);
  const totKm = rows.reduce((a, r) => a + r[1], 0);
  const front = UFS.reduce((a, u, i) => a + (i > 0 && paisOf(u.sigla) !== paisOf(UFS[i - 1].sigla) ? 1 : 0), 0);
  const bk = DATA.etapas.filter(e => e.barco).reduce((a, e) => a + e.barco.km, 0);
  let hi = 0, so = 0, no = 0;
  P.forEach((p, i) => { if (p[0] > P[hi][0]) hi = i; if (p[2] < P[so][2]) so = i; if (p[2] > P[no][2]) no = i; });
  const eb = DATA.etapas.filter(e => !e.barco && e.km > 0);
  const longest = maxBy(eb, e => e.km), climb = maxBy(eb, e => e.subida || 0), dry = maxBy(eb.filter(e => !e.rios), e => e.gap || 0);
  const longStay = maxBy(stops, s => restOf(s));
  const nm = id => byId[id].nome;
  const tiles = [
    ['Km de bike', fmt(DATA.regiao.km), '+ ' + fmt(DATA.regiao.km_laterais) + ' km de bate-voltas'],
    ['Países', rows.length, front + ' fronteiras cruzadas'],
    ['Subida total', fmt(Math.round(DATA.regiao.subida / 1000)) + ' mil m', '≈ ' + Math.round(DATA.regiao.subida / 8849) + ' vezes o Everest'],
    ['Ponto mais alto', fmt(P[hi][0]) + ' m', 'perto de ' + nearestStopAt(hi).nome],
    ['Paradas', stops.filter(s => !s.opcional).length, onroute.length + ' na rota · ' + stops.filter(s => s.opcional).length + ' desvios opcionais'],
    ['Duração estimada', duracao(SCH.total), 'chegada em ' + fM(SCH.total)],
  ];
  let h = `<div class="tiles">${tiles.map(t => `<div class="tile"><div class="l">${t[0]}</div><div class="v">${t[1]}</div><div class="s">${t[2]}</div></div>`).join('')}</div>`;
  const vis = onroute.filter(s => done.has(s.id));
  if (vis.length) {
    const last = maxBy(vis, s => s.km), pct = last.km / DATA.regiao.km * 100;
    h += `<div class="h3">Progresso</div><div class="meter" role="img" aria-label="${fmt(pct)}% da rota"><i style="width:${pct.toFixed(1)}%"></i></div><div class="cnote" style="margin-top:2px">${fmt(last.km)} km de ${fmt(DATA.regiao.km)} (${fmt1(pct)}%) · último ponto marcado: ${last.nome}</div>`;
  } else {
    h += `<p class="cnote">Durante a viagem, marque as paradas como visitadas para ver aqui quanto já pedalou. As marcações ficam salvas neste aparelho.</p>`;
  }
  h += `<div class="h3">Km de bike por país</div><div class="chartbox"><svg id="kmpais" role="img" aria-label="Km de bike por país"></svg><div class="tip" id="tip2" hidden></div></div>`;
  h += `<div class="h3">Recordes da rota</div>`;
  const recs = [
    ['Etapa mais longa', fmt(longest.km) + ' km', nm(longest.de) + ' → ' + nm(longest.para)],
    ['Etapa com mais subida', fmt(Math.round(climb.subida / 10) * 10) + ' m', nm(climb.de) + ' → ' + nm(climb.para)],
    ['Maior trecho sem cidade', fmt(dry.gap) + ' km', nm(dry.de) + ' → ' + nm(dry.para)],
    ['Ponto mais ao sul', fmt1(Math.abs(P[so][2])) + '° S', 'perto de ' + nearestStopAt(so).nome],
    ['Ponto mais ao norte', fmt1(Math.abs(P[no][2])) + '° S', 'perto de ' + nearestStopAt(no).nome],
    ['Mais tempo num lugar', restOf(longStay) + ' dias', longStay.nome],
    ['Travessias de barco', '~' + fmt(bk) + ' km', DATA.etapas.filter(e => e.barco).length + ' travessias curtas'],
  ];
  h += recs.map(r => `<div class="rec"><span>${r[0]}</span><span class="rv">${r[1]}</span><span class="rw">${r[2]}</span></div>`).join('');
  h += `<p class="cnote">Para anotar os dados reais de cada dia, use a <a href="https://claude.ai/artifact/FrpSBxr2431eACBUXhyNC3" target="_blank" rel="noopener">planilha da viagem</a>.</p>`;
  el.innerHTML = h;
  drawPaises(rows, totKm);
}
function drawPaises(rows, totKm) {
  const el = document.getElementById('kmpais'); if (!el) return;
  const tip = document.getElementById('tip2');
  const w = el.getBoundingClientRect().width || 360, rowH = 30, h = rows.length * rowH + 6, m = {l: 76, r: 120};
  const x = d3.scaleLinear([0, d3.max(rows, r => r[1])], [m.l, w - m.r]);
  const s = d3.select(el).attr('viewBox', `0 0 ${w} ${h}`).attr('height', h);
  s.selectAll('*').remove();
  const g = s.selectAll('g').data(rows).join('g').attr('transform', (d, i) => `translate(0,${3 + i * rowH})`)
    .attr('tabindex', 0).attr('role', 'img').attr('aria-label', d => `${d[0]}: ${fmt(d[1])} km, ${fmt(d[1] / totKm * 100)}% da rota`);
  g.append('rect').attr('class', 'hit').attr('fill', 'transparent').attr('x', 0).attr('width', w).attr('y', 0).attr('height', rowH);
  g.append('text').attr('class', 'clab').attr('x', m.l - 8).attr('y', rowH / 2 + 4).attr('text-anchor', 'end').text(d => d[0]);
  g.append('path').attr('class', 'bar').attr('d', d => barPath(m.l, rowH / 2 - 8, x(d[1]) - m.l, 16));
  g.append('text').attr('class', 'vlab').attr('x', d => x(d[1]) + 6).attr('y', rowH / 2 + 4).text(d => `${fmt(d[1])} km · ${fmt(d[1] / totKm * 100)}%`);
  g.on('pointerenter pointermove focus', function (ev, d) {
      s.selectAll('.bar').classed('on', false); d3.select(this).select('.bar').classed('on', true);
      const i = rows.indexOf(d);
      showTip(tip, (m.l + x(d[1])) / 2, 3 + i * rowH + rowH / 2 - 8, fmt(d[1]) + ' km', [d[0] + ' · ' + fmt(d[1] / totKm * 100) + '% da rota']);
    })
    .on('pointerleave blur', function () { d3.select(this).select('.bar').classed('on', false); tip.hidden = true; });
}

/* ---------- GPX ---------- */
/* zip simples (sem compressão) com um arquivo: o download do app aceita .zip, mas não .gpx */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipOne(name, text) {
  const enc = new TextEncoder(), nb = enc.encode(name), data = enc.encode(text), crc = crc32(data);
  const lh = new DataView(new ArrayBuffer(30));
  lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
  lh.setUint16(10, 0, true); lh.setUint16(12, 0x21, true); lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true);
  lh.setUint32(22, data.length, true); lh.setUint16(26, nb.length, true); lh.setUint16(28, 0, true);
  const cd = new DataView(new ArrayBuffer(46));
  cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint16(8, 0x0800, true);
  cd.setUint16(10, 0, true); cd.setUint16(12, 0, true); cd.setUint16(14, 0x21, true); cd.setUint32(16, crc, true);
  cd.setUint32(20, data.length, true); cd.setUint32(24, data.length, true); cd.setUint16(28, nb.length, true);
  cd.setUint16(30, 0, true); cd.setUint16(32, 0, true); cd.setUint16(34, 0, true); cd.setUint16(36, 0, true);
  cd.setUint32(38, 0, true); cd.setUint32(42, 0, true);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(4, 0, true); end.setUint16(6, 0, true); end.setUint16(8, 1, true);
  end.setUint16(10, 1, true); end.setUint32(12, 46 + nb.length, true); end.setUint32(16, 30 + nb.length + data.length, true); end.setUint16(20, 0, true);
  return new Blob([lh, nb, data, cd, nb, end], {type: 'application/zip'});
}
let DL = null, NATIVO = null;
const gpxBtn = document.getElementById('gpxbtn'), dlMsg = document.getElementById('dlmsg');
const say = t => { dlMsg.textContent = t; dlMsg.hidden = !t; };
(async () => {
  try { DL = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('downloads') : null; } catch (e) { DL = null; }
  gpxBtn.hidden = !(DL || NATIVO);
})();
addEventListener('rotas:nativo', ev => {
  NATIVO = ev.detail;
  gpxBtn.title = 'Salva o trecho em GPX ou abre direto no app de mapa (Organic Maps, OsmAnd, komoot, Strava)';
  gpxBtn.hidden = false;
});
gpxBtn.addEventListener('click', async () => {
  const g = DATA.gpx && DATA.gpx[scope];
  if (!g || !(DL || NATIVO)) return;
  say('Preparando o arquivo…');
  try {
    const r = await fetch(g.arquivo);
    if (!r.ok) throw {code: 'fetch'};
    const texto = await r.text();
    if (NATIVO) {
      try { await NATIVO.salvarGPX(g.nome, texto); say(''); }
      catch (e) { say(/cancel/i.test(String((e && e.message) || e)) ? '' : 'Não deu para salvar o GPX. Tente de novo.'); }
      return;
    }
    const blob = zipOne(g.nome, texto);
    const nome = 'rota-' + (scope === 'NE' ? 'inteira' : norm(ufBy[scope].nome).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')) + '.zip';
    await DL.save({filename: nome, data: blob});
    say('Pronto. Descompacte o .zip para pegar o arquivo GPX.');
  } catch (err) {
    const c = err && err.code;
    if (c === 'declined') say('');
    else if (c === 'rate_limited') say('Já tem um download aberto. Tente de novo em instantes.');
    else say('Não deu para baixar aqui. Tente abrir o app pelo navegador do computador.');
  }
});

window.__rotas = {
  voltar() {
    if (selected) { select(null); return true; }
    if (query) { query = ''; qIn.value = ''; renderList(); return true; }
    if (tab !== 'paradas') { setTab('paradas'); return true; }
    if (scope !== 'NE') { setScope('NE'); return true; }
    return false;
  }
};

/* ---------- início ---------- */
computeSchedule();
syncCfgInputs();
layout(); renderHeader(); drawProfile(); renderList();
document.getElementById('lg-aprox').hidden = !DATA.linha_aprox.length;
if (scope !== 'NE') { styleStates(); fitScope(); }
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { layout(); drawProfile(); if (tab === 'crono') drawKmMes(); if (tab === 'nums') renderNums(); }, 120); });
</script>
