name: Gerar APK

on:
  push:
    branches: [main, 'perf/fluidez-e-funcoes']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependências
        run: npm ci

      - name: Montar o app web
        run: npm run build

      - name: Copiar para o Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../RotasDeBike.apk

      - name: Guardar o APK no Actions
        uses: actions/upload-artifact@v4
        with:
          name: RotasDeBike-${{ github.run_number }}
          path: RotasDeBike.apk

      - name: Publicar na página de Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAG="rotas-v1.0.${{ github.run_number }}"
            gh release create "$TAG" RotasDeBike.apk \
              --title "Rotas de Bike v1.0.${{ github.run_number }}" \
              --notes "Build da versão principal."
              --latest
          else
            echo "Build de teste na branch ${GITHUB_REF_NAME}; APK disponível nos Actions artifacts."
          fi
