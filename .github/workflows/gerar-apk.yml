name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependências
        run: npm ci

      - name: Montar o app web
        run: npm run build

      - name: Copiar para o Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../RotasDeBike.apk

      - name: Guardar o APK no Actions
        uses: actions/upload-artifact@v4
        with:
          name: RotasDeBike-${{ github.run_number }}
          path: RotasDeBike.apk

      - name: Publicar na página de Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="rotas-v1.0.${{ github.run_number }}"
          gh release create "$TAG" RotasDeBike.apk \
            --title "Rotas de Bike v1.0.${{ github.run_number }}" \
            --notes "Baixe o arquivo RotasDeBike.apk no celular e instale. Versão gerada a partir do commit ${GITHUB_SHA::7}." \
            --latest
